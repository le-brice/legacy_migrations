version: 2

seeds:
  - name: customers
    description: Synthetic customer seed data for migration demos with intentional duplicate and null edge cases.
    config:
      database: dbt_sandbox_brice
      schema: RAW
      quote_columns: false
      column_types:
        customer_id: varchar(10)
        customer_natural_key: varchar(20)
        first_name: varchar(50)
        last_name: varchar(50)
        email: varchar(150)
        phone: varchar(30)
        country_code: varchar(2)
        created_at: timestamp_ntz
        marketing_opt_in: boolean
        loyalty_tier: varchar(20)
        lifetime_value: number(12,2)

  - name: orders
    description: Synthetic order seed data with inconsistent currency codes and some null fields.
    config:
      database: dbt_sandbox_brice
      schema: RAW
      quote_columns: false
      column_types:
        order_id: varchar(12)
        customer_id: varchar(10)
        order_date: timestamp_ntz
        order_status: varchar(20)
        currency_code: varchar(10)
        payment_method: varchar(20)
        shipping_country_code: varchar(2)
        subtotal_amount: number(12,2)
        shipping_amount: number(12,2)
        tax_amount: number(12,2)
        discount_amount: number(12,2)
        total_amount: number(12,2)

  - name: order_items
    description: Synthetic order line items for migration demos.
    config:
      database: dbt_sandbox_brice
      schema: RAW
      quote_columns: false
      column_types:
        order_item_id: varchar(14)
        order_id: varchar(12)
        line_number: integer
        sku: varchar(30)
        product_name: varchar(100)
        product_category: varchar(50)
        quantity: integer
        unit_price: number(12,2)
        extended_price: number(12,2)
